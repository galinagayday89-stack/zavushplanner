<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабінет заступника директора</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#1B2340;
  --paper:#F8F7F3;
  --paper-line:#E3E1DA;
  --navy:#232F52;
  --navy-deep:#161E38;
  --gold:#C9A227;
  --gold-deep:#A6841D;
  --plum:#7A3B57;
  --danger:#B5495B;
  --success:#3E7C58;
  --muted:#62666F;
  --card-shadow: 0 2px 12px rgba(27,35,64,0.08);
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:var(--paper);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Playfair Display', serif;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
.mono{font-family:'IBM Plex Mono', monospace;}

.app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.side-nav{
  width:220px; flex-shrink:0; background:var(--navy-deep);
  padding:28px 0; display:flex; flex-direction:column; gap:6px;
}
.brand{color:#fff; padding:0 22px 22px 22px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:14px;}
.brand .title{font-family:'Playfair Display',serif; font-size:19px; font-weight:600; line-height:1.3;}
.brand .sub{font-size:11.5px; color:#9AA3C0; margin-top:5px; letter-spacing:.03em;}
.tab-btn{
  position:relative; display:flex; align-items:center; gap:11px; border:none; background:transparent;
  color:#C7CCE0; text-align:left; padding:13px 18px 13px 22px; font-size:14.5px; font-weight:600; min-height:46px;
  transition:background .15s, color .15s;
}
.tab-btn svg{flex-shrink:0; width:19px; height:19px;}
.tab-btn:hover{background:rgba(255,255,255,0.06); color:#fff;}
.tab-btn.active{background:var(--paper); color:var(--navy-deep); border-radius:10px 0 0 10px; margin-right:-1px;}
.tab-btn.active::before{content:''; position:absolute; left:7px; top:50%; transform:translateY(-50%); width:5px; height:5px; border-radius:50%; background:var(--gold);}

/* ---------- Main ---------- */
.main{flex:1; min-width:0;}
.topbar{background:var(--paper); border-bottom:2px solid var(--ink); padding:22px 32px 18px 32px;}
.author-line{font-size:11.5px; font-weight:700; letter-spacing:.04em; color:var(--gold-deep); text-transform:uppercase; margin-bottom:6px;}
.topbar h1{margin:0; font-size:25px;}
.topbar p{margin:4px 0 0 0; color:var(--muted); font-size:13.5px;}
.content{padding:26px 32px 60px 32px; max-width:1180px;}
.app-footer{padding:16px 32px 30px 32px; color:var(--muted); font-size:12px; border-top:1px solid var(--paper-line); margin-top:10px;}

/* ---------- Cards ---------- */
.card{background:#fff; border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:20px; margin-bottom:20px;}
.card h2{margin:0 0 14px 0; font-size:18px;}
.subject-row-block{border:1px solid var(--paper-line); border-radius:10px; padding:12px; margin-bottom:12px; background:#FBFAF7;}
.class-groups-wrap{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
.class-group-block{background:#F1EEE2; border:1.5px solid var(--gold); border-radius:8px; padding:10px 10px 8px;}
.class-group-label{font-size:11px; font-weight:800; color:var(--gold-deep); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.card h3{margin:0 0 10px 0; font-size:15px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:.02em;}
input[type=text], input[type=date], select, textarea{
  border:1.5px solid var(--paper-line); background:#fff; border-radius:8px; padding:10px 12px;
  font-size:14px; color:var(--ink); min-height:44px;
}
textarea{min-height:100px; resize:vertical; line-height:1.5;}

/* ---------- Голосове введення ---------- */
.input-with-mic{position:relative; width:100%;}
.input-with-mic input, .input-with-mic textarea{width:100%; padding-right:42px;}
.mic-btn{
  position:absolute; right:5px; top:5px; background:none; border:none; color:var(--muted);
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.input-with-mic input ~ .mic-btn{ top:50%; transform:translateY(-50%); }
.mic-btn:hover{background:#F1EEE2; color:var(--navy);}
.mic-btn.recording{background:var(--danger); color:#fff; animation:mic-pulse 1.1s infinite;}
@keyframes mic-pulse{0%{box-shadow:0 0 0 0 rgba(181,73,91,.5);} 70%{box-shadow:0 0 0 8px rgba(181,73,91,0);} 100%{box-shadow:0 0 0 0 rgba(181,73,91,0);}}
input[type=text]:focus, input[type=date]:focus, select:focus, textarea:focus{border-color:var(--navy);}
.btn{border:none; border-radius:8px; padding:11px 18px; font-weight:700; font-size:14px; min-height:44px; display:inline-flex; align-items:center; gap:8px; transition:filter .15s;}
.btn:hover{filter:brightness(0.94);}
.btn:active{filter:brightness(0.88);}
.btn-primary{background:var(--navy); color:#fff;}
.btn-gold{background:var(--gold); color:var(--navy-deep);}
.btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--paper-line);}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
.btn-danger.confirming{background:var(--danger); color:#fff;}
.btn:disabled{opacity:.55; cursor:not-allowed;}
.btn-icon{padding:9px; min-width:44px; justify-content:center;}

/* ---------- Dashboard summary ---------- */
.summary-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px;}
.summary-card{background:var(--navy); color:#fff; border-radius:var(--radius); padding:18px 20px; box-shadow:var(--card-shadow);}
.summary-card .num{font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--gold);}
.summary-card .lbl{font-size:12.5px; color:#C7CCE0; margin-top:2px;}

/* ---------- Calendar ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.cal-nav{display:flex; align-items:center; gap:8px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{font-size:11.5px; font-weight:800; text-align:center; color:var(--muted); padding-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
.cal-cell{border:1.5px solid var(--paper-line); border-radius:9px; min-height:88px; padding:6px 7px; background:#fff; display:flex; flex-direction:column; gap:3px; text-align:left; min-width:0; transition:border-color .12s, transform .12s;}
.cal-cell:hover{border-color:var(--navy); transform:translateY(-1px);}
.cal-cell.empty{background:transparent; border:none; box-shadow:none;}
.cal-cell.weekend{background:#F3F1EA;}
.cal-cell.today{border-color:var(--gold); border-width:2px;}
.cal-daynum{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px;}
.cal-note{font-size:10.5px; line-height:1.25; padding:2px 5px; border-radius:5px; background:#EFEAF1; color:var(--plum); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---------- Teacher cards ---------- */
.teacher-card{border-left:4px solid var(--navy);}
.teacher-head{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;}
.teacher-head-left{display:flex; flex-direction:column; gap:2px;}
.teacher-name{font-weight:700; font-size:15.5px;}
.teacher-subject{font-size:12.5px; color:var(--muted);}
.teacher-body{display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--paper-line);}
.teacher-body.open{display:block;}
.chevron{transition:transform .15s;}
.chevron.rot{transform:rotate(180deg);}

table.sched{border-collapse:collapse; width:100%;}
table.sched th, table.sched td{border:1.5px solid var(--paper-line); padding:6px; text-align:center; vertical-align:middle;}
table.sched th{background:#F1EEE2; font-size:12.5px; padding:9px 6px;}
table.sched td.per-num{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--muted); width:38px; background:#FAF8F2;}
table.overall-sched td.overall-cell{vertical-align:top; text-align:left; padding:6px; min-width:150px;}
.overall-entry{font-size:11.5px; line-height:1.4; padding:5px 7px; margin-bottom:4px; background:#F1EEE2; border-radius:6px; border-left:3px solid var(--navy);}
.overall-entry:last-child{margin-bottom:0;}
table.sched input{width:100%; min-width:90px; text-align:center; min-height:40px; font-size:12.5px;}

/* ---------- Planning ---------- */
.plan-card{border-left:4px solid var(--plum);}
.plan-title{font-weight:700; font-size:15.5px; margin-bottom:4px;}
.plan-meta{font-size:11.5px; color:var(--muted); margin-bottom:10px;}
.plan-desc{font-size:13.5px; color:var(--ink); line-height:1.5; margin-bottom:10px; white-space:pre-wrap;}
.prompt-output{background:#FAF8F2; border:1.5px solid var(--paper-line); border-radius:9px; padding:14px 16px; margin-top:12px; font-size:13px; line-height:1.6; white-space:pre-wrap; max-height:320px; overflow-y:auto;}

/* ---------- Modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(27,35,64,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}
.overlay.hidden{display:none;}
.modal{background:var(--paper); border-radius:14px; max-width:560px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,.28); padding:22px;}
.modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
.close-x{background:none; border:none; width:36px; height:36px; border-radius:8px;}
.close-x:hover{background:var(--paper-line);}
.note-row{display:flex; gap:8px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--paper-line);}
.note-row:last-child{border-bottom:none;}
.note-text{flex:1; font-size:13.5px; line-height:1.5; white-space:pre-wrap;}
.note-remove-btn{background:none; border:none; color:var(--muted); flex-shrink:0; width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center;}
.note-remove-btn:hover{background:#F6E3E7; color:var(--danger);}

.empty-hint{color:var(--muted); font-size:13.5px; padding:8px 0;}
.warn-hint{color:var(--danger); background:#FBEAEE; border:1px solid #EABFC9; border-radius:8px; padding:8px 12px; font-size:13px; margin:0 0 10px 0;}
.loader{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13.5px; padding:10px 0;}
.spinner{width:18px; height:18px; border:3px solid var(--paper-line); border-top-color:var(--navy); border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:30px; font-size:13.5px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

@media (max-width:760px){
  .app{flex-direction:column;}
  .side-nav{width:100%; flex-direction:row; overflow-x:auto; padding:14px 10px; gap:4px;}
  .brand{display:none;}
  .tab-btn{white-space:nowrap; border-radius:8px !important; margin:0 !important;}
  .content{padding:18px 14px 50px 14px;}
  .cal-cell{min-height:70px;}
}
</style>
</head>
<body>
<div class="app">

  <nav class="side-nav" aria-label="Розділи кабінету">
    <div class="brand">
      <div class="title">Кабінет заступника</div>
      <div class="sub">з навчально-виховної роботи</div>
    </div>
    <button class="tab-btn active" data-tab="calendar" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      Календар
    </button>
    <button class="tab-btn" data-tab="staff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Розклад закладу
    </button>
    <button class="tab-btn" data-tab="myschedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Мій розклад
    </button>
    <button class="tab-btn" data-tab="planning">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h7"/></svg>
      Планування
    </button>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="author-line">Створено Галина Гайдай</div>
      <h1 id="topbarTitle" class="serif">Календар</h1>
      <p id="topbarSub">Управлінський календар навчального року</p>
    </div>
    <div class="content" id="content"></div>
    <div class="app-footer">Створено Галина Гайдай</div>
  </main>
</div>

<div class="overlay hidden" id="dayOverlay"><div class="modal" id="dayModal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
/* ====================== СХОВИЩЕ ====================== */
const AppStorage = (function(){
  const hasNative = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  const LS_PREFIX = 'zavuchPlanner__';
  function lsKey(key, shared){ return LS_PREFIX + (shared ? 'shared__' : '') + key; }
  function lsGet(key, shared){
    return new Promise((resolve, reject)=>{
      try{
        const raw = localStorage.getItem(lsKey(key, shared));
        if(raw === null){ reject(new Error('key not found: ' + key)); return; }
        resolve({ key, value: raw, shared: !!shared });
      }catch(e){ reject(e); }
    });
  }
  function lsSet(key, value, shared){
    return new Promise((resolve, reject)=>{
      try{
        localStorage.setItem(lsKey(key, shared), value);
        resolve({ key, value, shared: !!shared });
      }catch(e){
        if(e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)){
          reject(new Error('Сховище браузера переповнене (localStorage). Очистіть кеш або скоротіть дані.'));
        } else { reject(e); }
      }
    });
  }
  function lsDelete(key, shared){
    return new Promise((resolve, reject)=>{
      try{ localStorage.removeItem(lsKey(key, shared)); resolve({ key, deleted:true, shared: !!shared }); }
      catch(e){ reject(e); }
    });
  }
  if(hasNative){
    return { isNative:true, get:(k,s)=>window.storage.get(k,s), set:(k,v,s)=>window.storage.set(k,v,s), delete:(k,s)=>window.storage.delete(k,s) };
  }
  console.info('AppStorage: window.storage недоступний — використовую localStorage браузера.');
  return { isNative:false, get:lsGet, set:lsSet, delete:lsDelete };
})();

/* ====================== СТАН ====================== */
const WEEKDAY_KEYS = ['Пн','Вт','Ср','Чт','Пт'];
const MONTH_NAMES = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const DOW_LABELS = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const now = new Date();
const defaultStartYear = now.getFullYear();

function emptySchedule(periods){
  periods = periods || 7;
  const s = {};
  WEEKDAY_KEYS.forEach(d=> s[d] = new Array(periods).fill(''));
  return s;
}

function normalizeText(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }

function cellMetaKey(teacherId, day, period){ return `${teacherId}__${day}__${period}`; }

/* Будує мапи зайнятості кабінетів і класів по всьому закладу (по всіх вчителях),
   на основі state.cellMeta — тобто лише тих клітинок, які були призначені автоматично
   (з вказаним кабінетом і/або класом). Клітинки, вписані вручну, у перевірці участі не беруть. */
function getGlobalOccupancy(){
  const roomBusy = new Set();  // `${day}|${period}|${кабінет}`
  const classBusy = new Set(); // `${day}|${period}|${клас}`
  Object.values(state.cellMeta).forEach(meta=>{
    if(meta.room) roomBusy.add(`${meta.day}|${meta.period}|${normalizeText(meta.room)}`);
    if(meta.classLabel) classBusy.add(`${meta.day}|${meta.period}|${meta.classLabel}`);
  });
  return { roomBusy, classBusy };
}

/* Автоматично розподіляє години предметів по вільних клітинках розкладу конкретного вчителя,
   уникаючи одночасного зайняття того самого кабінету чи того самого класу іншим вчителем.
   subjectsWithHours: [{name, hours, room, classLabel}]. Заповнює лише порожні клітинки
   і лише ті, де кабінет/клас вільні по всьому закладу.
   options.dayStartOffset / options.periodOrder — зсув старту, щоб однакові предмет+години
   не лягали в ті самі клітинки в різних вчителів.
   Повертає масив {name, remaining} для предметів, яким не вистачило вільних безконфліктних місць. */
function autoDistributeHours(teacherId, schedule, subjectsWithHours, options){
  options = options || {};
  const leftover = [];
  const periodsPerDay = schedule['Пн'].length;
  const totalSlots = periodsPerDay * WEEKDAY_KEYS.length;
  const dayStart = ((options.dayStartOffset || 0) % WEEKDAY_KEYS.length + WEEKDAY_KEYS.length) % WEEKDAY_KEYS.length;
  const periodOrder = (options.periodOrder && options.periodOrder.length === periodsPerDay)
    ? options.periodOrder
    : Array.from({length:periodsPerDay}, (_,i)=>i);
  const occ = getGlobalOccupancy();
  const conflicts = []; // назви предметів, для яких доводилось пропускати зайняті кабінет/клас

  subjectsWithHours.forEach(({name, hours, room, classLabel})=>{
    let remaining = Math.max(0, hours);
    let dayCursor = dayStart;
    let guard = 0;
    let hadConflict = false;
    while(remaining > 0 && guard < totalSlots * 4){
      guard++;
      const day = WEEKDAY_KEYS[dayCursor % WEEKDAY_KEYS.length];
      dayCursor++;
      let placed = false;
      for(const p of periodOrder){
        if(schedule[day][p] && schedule[day][p].trim()) continue; // клітинка вчителя вже зайнята
        const roomKey = room ? `${day}|${p}|${normalizeText(room)}` : null;
        const classKey = classLabel ? `${day}|${p}|${classLabel}` : null;
        if(roomKey && occ.roomBusy.has(roomKey)){ hadConflict = true; continue; }
        if(classKey && occ.classBusy.has(classKey)){ hadConflict = true; continue; }
        const labelParts = [name];
        if(classLabel) labelParts.push(classLabel);
        let label = labelParts.join(' ');
        if(room) label += ` (каб.${room})`;
        schedule[day][p] = label;
        state.cellMeta[cellMetaKey(teacherId, day, p)] = { teacherId, day, period:p, subject:name, room: room||'', classLabel: classLabel||'' };
        if(roomKey) occ.roomBusy.add(roomKey);
        if(classKey) occ.classBusy.add(classKey);
        remaining--;
        placed = true;
        break;
      }
      if(dayCursor % WEEKDAY_KEYS.length === 0 && !placed){
        const anyFreeAtAll = WEEKDAY_KEYS.some(d=> schedule[d].some(x=>!x || !x.trim()));
        if(!anyFreeAtAll) break;
      }
    }
    if(remaining > 0) leftover.push({ name, remaining, conflict: hadConflict });
  });
  return leftover;
}

/* Будує розсіяний зсув старту для N-го за рахунком вчителя/виклику,
   щоб однакові предмет+години не лягали в ті самі клітинки в різних вчителів. */
function buildStaggerOptions(index, periodsPerDay){
  const dayStartOffset = index % WEEKDAY_KEYS.length;
  const shift = index % periodsPerDay;
  const periodOrder = Array.from({length:periodsPerDay}, (_,i)=> (i + shift) % periodsPerDay);
  return { dayStartOffset, periodOrder };
}

let state = {
  teachers: [], // {id, name, subject, schedule:{Пн:[...], ...}}
  mySchedule: emptySchedule(6),
  calendarNotes: {}, // 'YYYY-MM-DD': [{id, text}]
  plans: [], // {id, title, description, createdAt}
  cellMeta: {}, // `${teacherId}__${day}__${period}` -> {teacherId, day, period, subject, room, classLabel}
  settings: { startDate: `${defaultStartYear}-09-01` }
};

let view = { year: defaultStartYear, month: 8 };

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function weekdayKeyFor(date){ const m={1:'Пн',2:'Вт',3:'Ср',4:'Чт',5:'Пт'}; return m[date.getDay()] || null; }
function todayStr(){ return fmtDate(new Date()); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cssEscape(str){ return String(str).replace(/["\\]/g, '\\$&'); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ====================== ЗБЕРЕЖЕННЯ ====================== */
let saveStateTimer = null;
let pendingSaveResolvers = [];
let saveStatePending = false;
function saveState(){
  return new Promise((resolve)=>{
    pendingSaveResolvers.push(resolve);
    if(saveStateTimer) clearTimeout(saveStateTimer);
    saveStateTimer = setTimeout(async ()=>{
      const resolvers = pendingSaveResolvers; pendingSaveResolvers = []; saveStateTimer = null;
      try{
        await AppStorage.set('zavuch-state', JSON.stringify(state));
      }catch(e){
        console.error('Помилка збереження', e);
        if(!saveStatePending){
          saveStatePending = true;
          showToast(`Не вдалося зберегти зміни: ${e && e.message ? e.message : 'невідома помилка'}`);
          setTimeout(()=>{ saveStatePending = false; }, 6000);
        }
      }
      resolvers.forEach(r=>r());
    }, 300);
  });
}
async function loadState(){
  try{
    const res = await AppStorage.get('zavuch-state');
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      state = Object.assign(state, loaded);
      if(!state.settings) state.settings = { startDate: `${defaultStartYear}-09-01` };
      if(!Array.isArray(state.teachers)) state.teachers = [];
      if(!state.mySchedule) state.mySchedule = emptySchedule(6);
      if(!state.calendarNotes) state.calendarNotes = {};
      if(!Array.isArray(state.plans)) state.plans = [];
      if(!state.cellMeta || typeof state.cellMeta !== 'object') state.cellMeta = {};
      const sd = new Date(state.settings.startDate);
      if(!isNaN(sd)) view = { year: sd.getFullYear(), month: sd.getMonth() };
    }
  }catch(e){ /* ключа ще немає */ }
  stateLoaded = true;
}

/* ====================== КАЛЕНДАР ====================== */
function notesForDate(dateStr){ return state.calendarNotes[dateStr] || []; }

function lastFridayOfMonth(year, monthIndex){
  let d = new Date(year, monthIndex+1, 0); // останній день місяця
  while(d.getDay() !== 5) d.setDate(d.getDate()-1);
  return d;
}

/* Додає типові важливі дати навчального року (на основі дати початку в налаштуваннях).
   Дати на кшталт "останній дзвоник" — орієнтовні, редагуйте за потреби.
   Повертає кількість фактично доданих (не дублює вже наявні). */
function addStandardSchoolDates(){
  const sd = new Date(state.settings.startDate);
  const Y = isNaN(sd) ? defaultStartYear : sd.getFullYear();
  const lastFriday = lastFridayOfMonth(Y+1, 4); // травень
  const items = [
    { date: `${Y}-09-01`, text: 'День знань — початок навчального року' },
    { date: `${Y}-10-05`, text: 'Всесвітній день учителя' },
    { date: `${Y}-10-14`, text: 'День захисників і захисниць України' },
    { date: `${Y}-12-25`, text: 'Різдво Христове' },
    { date: `${Y+1}-01-01`, text: 'Новий рік' },
    { date: `${Y+1}-03-08`, text: 'Міжнародний жіночий день' },
    { date: fmtDate(lastFriday), text: 'Орієнтовно останній дзвоник (уточніть точну дату закладу)' },
    { date: `${Y+1}-06-01`, text: 'Міжнародний день захисту дітей' },
  ];
  let added = 0;
  items.forEach(item=>{
    if(!state.calendarNotes[item.date]) state.calendarNotes[item.date] = [];
    const exists = state.calendarNotes[item.date].some(n=>n.text === item.text);
    if(!exists){
      state.calendarNotes[item.date].push({ id: uid(), text: item.text });
      added++;
    }
  });
  if(added > 0) saveState();
  return added;
}

function renderCalendarTab(){
  const c = document.getElementById('content');
  const monthLabel = `${MONTH_NAMES[view.month]} ${view.year}`;
  const first = new Date(view.year, view.month, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(view.year, view.month+1, 0).getDate();
  const monthOptions = MONTH_NAMES.map((n,i)=>`<option value="${i}" ${i===view.month?'selected':''}>${n}</option>`).join('');
  const years = []; for(let y=defaultStartYear-1; y<=defaultStartYear+2; y++) years.push(y);
  const yearOptions = years.map(y=>`<option value="${y}" ${y===view.year?'selected':''}>${y}</option>`).join('');

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(view.year, view.month, d);
    const dateStr = fmtDate(dateObj);
    const isWeekend = [0,6].includes(dateObj.getDay());
    const isToday = dateStr === todayStr();
    const notes = notesForDate(dateStr);
    const noteHtml = notes.slice(0,2).map(n=>`<div class="cal-note" title="${escapeHtml(n.text)}">${escapeHtml(n.text)}</div>`).join('')
      + (notes.length>2 ? `<div class="cal-note">+${notes.length-2} ще</div>` : '');
    cells += `
      <button class="cal-cell ${isWeekend?'weekend':''} ${isToday?'today':''}" data-date="${dateStr}" aria-label="Відкрити день ${d} ${MONTH_NAMES[view.month]}">
        <div class="cal-daynum">${d}</div>
        ${noteHtml}
      </button>`;
  }

  c.innerHTML = `
    ${renderSummary()}
    <div class="card">
      <div class="cal-head">
        <div class="cal-nav">
          <button class="btn btn-ghost btn-icon" id="prevMonth" aria-label="Попередній місяць"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <select id="monthSelect" aria-label="Місяць">${monthOptions}</select>
          <select id="yearSelect" aria-label="Рік">${yearOptions}</select>
          <button class="btn btn-ghost btn-icon" id="nextMonth" aria-label="Наступний місяць"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <button class="btn btn-ghost" id="gotoStart">До вересня</button>
        <button class="btn btn-gold" id="addStandardDates">+ Додати типові дати навчального року</button>
      </div>
      <div class="cal-grid">
        ${DOW_LABELS.map(l=>`<div class="cal-dow">${l}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `;
  document.getElementById('prevMonth').onclick = ()=>{ view.month--; if(view.month<0){view.month=11; view.year--;} renderCalendarTab(); };
  document.getElementById('nextMonth').onclick = ()=>{ view.month++; if(view.month>11){view.month=0; view.year++;} renderCalendarTab(); };
  document.getElementById('monthSelect').onchange = e=>{ view.month=parseInt(e.target.value); renderCalendarTab(); };
  document.getElementById('yearSelect').onchange = e=>{ view.year=parseInt(e.target.value); renderCalendarTab(); };
  document.getElementById('gotoStart').onclick = ()=>{ const sd=new Date(state.settings.startDate); view={year:sd.getFullYear(),month:sd.getMonth()}; renderCalendarTab(); };
  document.getElementById('addStandardDates').onclick = ()=>{
    const added = addStandardSchoolDates();
    renderCalendarTab();
    showToast(added>0 ? `Додано ${added} типових дат навчального року` : 'Типові дати вже додані раніше');
  };
  c.querySelectorAll('.cal-cell[data-date]').forEach(el=> el.addEventListener('click', ()=>openDayModal(el.dataset.date)));
}

function openDayModal(dateStr){
  const dateObj = new Date(dateStr+'T00:00:00');
  const dayLabel = `${dateObj.getDate()} ${MONTH_NAMES[dateObj.getMonth()].toLowerCase()} ${dateObj.getFullYear()}`;
  const overlay = document.getElementById('dayOverlay');
  const modal = document.getElementById('dayModal');
  const notes = notesForDate(dateStr);

  modal.innerHTML = `
    <div class="modal-head">
      <div><h2 class="serif" style="margin:0">${dayLabel}</h2></div>
      <button class="close-x" id="closeModal" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="notesList">
      ${notes.length ? notes.map(n=>`
        <div class="note-row">
          <span class="note-text">${escapeHtml(n.text)}</span>
          <button type="button" class="note-remove-btn" data-id="${n.id}" aria-label="Видалити нотатку"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>`).join('') : `<p class="empty-hint">На цей день ще немає нотаток.</p>`}
    </div>
    <div class="field" style="margin-top:14px;">
      <label for="newNoteInput">Додати нотатку / подію</label>
      <div class="input-with-mic">
        <textarea id="newNoteInput" placeholder="Наприклад: педрада о 14:00, кабінет 12"></textarea>
        <button type="button" class="mic-btn" aria-label="Голосове введення" title="Голосове введення"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg></button>
      </div>
    </div>
    <div class="row" style="margin-top:10px; justify-content:flex-end;">
      <button class="btn btn-primary" id="addNoteBtn">Додати</button>
    </div>
  `;
  overlay.classList.remove('hidden');
  const close = ()=>overlay.classList.add('hidden');
  document.getElementById('closeModal').onclick = close;
  overlay.onclick = e=>{ if(e.target===overlay) close(); };
  modal.querySelectorAll('.note-remove-btn').forEach(btn=>{
    btn.onclick = ()=>{
      state.calendarNotes[dateStr] = (state.calendarNotes[dateStr]||[]).filter(n=>n.id!==btn.dataset.id);
      if(!state.calendarNotes[dateStr].length) delete state.calendarNotes[dateStr];
      saveState();
      openDayModal(dateStr);
      renderCalendarTab();
    };
  });
  document.getElementById('addNoteBtn').onclick = ()=>{
    const ta = document.getElementById('newNoteInput');
    const text = ta.value.trim();
    if(!text) return;
    if(!state.calendarNotes[dateStr]) state.calendarNotes[dateStr] = [];
    state.calendarNotes[dateStr].push({ id: uid(), text });
    saveState();
    openDayModal(dateStr);
    renderCalendarTab();
  };
}

/* ====================== РОЗКЛАД ЗАКЛАДУ ====================== */
const CLASS_LETTERS = ['А','Б','В','Г','Д'];

/* Оновлює лише текст-підказку "буде створено N записів" для конкретного рядка предмета,
   не перебудовуючи всю форму — щоб не втрачати фокус і позицію курсора під час друку. */
function updateRowPreview(ri){
  const row = newTeacherRows[ri];
  if(!row) return;
  const block = document.querySelector(`.subject-row-block[data-row-idx="${ri}"]`);
  if(!block) return;
  const entries = expandRowToEntries(row);
  let preview = block.querySelector('.row-preview');
  if(!entries.length){
    if(preview) preview.remove();
    return;
  }
  const text = `Буде створено ${entries.length} записів: ${entries.map(e=>`${e.classLabel||'без класу'}${e.room?' (каб.'+e.room+')':''}`).join(', ')} — кожен по ${row.hours||'…'} год.`;
  if(!preview){
    preview = document.createElement('p');
    preview.className = 'empty-hint row-preview';
    preview.style.margin = '6px 0 0';
    block.appendChild(preview);
  }
  preview.textContent = text;
}

    btn.onclick = ()=>{ newTeacherRows.splice(parseInt(btn.dataset.idx),1); renderSubjectRows(); };
  });
  wrap.querySelectorAll('.add-group-btn').forEach(btn=>{
    btn.onclick = ()=>{
      newTeacherRows[parseInt(btn.dataset.idx)].groups.push({ gradeNum:'', letters:[], room:'' });
      renderSubjectRows();
    };
  });
  wrap.querySelectorAll('.remove-group-btn').forEach(btn=>{
    btn.onclick = ()=>{
      newTeacherRows[parseInt(btn.dataset.ri)].groups.splice(parseInt(btn.dataset.gi),1);
      renderSubjectRows();
    };
  });
  wrap.querySelectorAll('.group-grade').forEach(sel=>{
    sel.onchange = ()=>{ newTeacherRows[parseInt(sel.dataset.ri)].groups[parseInt(sel.dataset.gi)].gradeNum = sel.value; renderSubjectRows(); };

  wrap.querySelectorAll('.group-room').forEach(inp=>{

  wrap.querySelectorAll('.group-letter-pill').forEach(pill=>{

      else g.letters.push(l);
      renderSubjectRows();
    };
  });
  wrap.querySelectorAll('.group-select-all').forEach(btn=>{
    btn.onclick = ()=>{
      const g = newTeacherRows[parseInt(btn.dataset.ri)].groups[parseInt(btn.dataset.gi)];

      g.letters = allSelected ? [] : [...CLASS_LETTERS];
      renderSubjectRows();
    };
  });

function syncSubjectRowsFromInputs(){
  document.querySelectorAll('.subject-row-name').forEach(inp=>{ newTeacherRows[parseInt(inp.dataset.idx)].name = inp.value; });
  document.querySelectorAll('.subject-row-hours').forEach(inp=>{ newTeacherRows[parseInt(inp.dataset.idx)].hours = inp.value; });
  document.querySelectorAll('.group-room').forEach(inp=>{ newTeacherRows[parseInt(inp.dataset.ri)].groups[parseInt(inp.dataset.gi)].room = inp.value; });
}
/* Розгортає один рядок форми (предмет зі спільними годинами + кілька груп "клас+літери+кабінет")
   у окремі записи для розподілу — по одному на кожен обраний клас/літеру, кожен зі своїм кабінетом.
   Кількість годин однакова для кожного отриманого запису (це стандарт по предмету на тиждень). */
function expandRowToEntries(row){
  const hours = parseInt(row.hours) || 0;
  if(!hours || !row.name.trim()) return [];
  const entries = [];
  row.groups.forEach(g=>{
    const room = (g.room||'').trim();
    if(!g.letters.length){
      const classLabel = g.gradeNum ? `${g.gradeNum} клас` : '';
      if(classLabel || row.groups.length===1) entries.push({ name: row.name.trim(), hours, room, classLabel });
    } else {
      g.letters.forEach(l=>{
        entries.push({
          name: row.name.trim(),
          hours,
          room,
          classLabel: g.gradeNum ? `${g.gradeNum}-${l}` : l
        });
      });
    }
  });
  return entries;
}

let newTeacherRows = [{ name:'', hours:'', groups:[{ gradeNum:'', letters:[], room:'' }] }];

function renderOverallScheduleHtml(){
  if(!state.teachers.length){
    return `<div class="card"><p class="empty-hint">Ще немає жодного вчителя — додайте вчителів у режимі «Список вчителів», щоб побачити зведений розклад.</p></div>`;
  }
  const maxPeriods = Math.max(...state.teachers.map(t=>t.schedule['Пн'].length));
  let rows = '';
  for(let p=0; p<maxPeriods; p++){
    rows += `<tr><td class="per-num">${p+1}</td>`;
    WEEKDAY_KEYS.forEach(day=>{
      const entries = state.teachers
        .filter(t=> t.schedule[day][p] && t.schedule[day][p].trim())
        .map(t=> `<div class="overall-entry"><strong>${escapeHtml(t.name)}</strong><br>${escapeHtml(t.schedule[day][p])}</div>`);
      rows += `<td class="overall-cell">${entries.join('') || '<span class="empty-hint" style="padding:0;">—</span>'}</td>`;
    });
    rows += `</tr>`;
  }
  return `
    <div class="card">
      <h2>Зведений розклад усіх вчителів</h2>
      <p class="empty-hint" style="margin-top:-6px;">Кожна клітинка показує всіх вчителів, які в цей час проводять урок — з предметом, класом і кабінетом (де вказано).</p>
      <div style="overflow-x:auto;">
        <table class="sched overall-sched">
          <thead><tr><th></th>${WEEKDAY_KEYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderStaffTab(){
  const c = document.getElementById('content');
  const toggleBar = `
    <div class="row" style="margin-bottom:18px; gap:8px;">

      <button class="btn ${staffViewMode==='overall'?'btn-primary':'btn-ghost'}" id="modeOverallBtn">Загальний розклад закладу</button>
    </div>`;

  if(staffViewMode === 'overall'){
    c.innerHTML = toggleBar + renderSummary() + renderOverallScheduleHtml();
    document.getElementById('modeListBtn').onclick = ()=>{ staffViewMode='list'; renderStaffTab(); };
    document.getElementById('modeOverallBtn').onclick = ()=>{ staffViewMode='overall'; renderStaffTab(); };
    return;
  }

  newTeacherRows = [{ name:'', hours:'', groups:[{ gradeNum:'', letters:[], room:'' }] }];
  c.innerHTML = toggleBar + `
    ${renderSummary()}
    <div class="card">
      <h2>Додати вчителя</h2>
      <div class="field">
        <label for="newTeacherName">Прізвище та ім'я</label>
        <div class="input-with-mic">
          <input type="text" id="newTeacherName" placeholder="Наприклад: Іваненко Марія Петрівна">
          <button type="button" class="mic-btn" aria-label="Голосове введення" title="Голосове введення"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg></button>
        </div>
      </div>
      <div class="field" style="margin-top:12px;">
        <label>Предмети, класи, кабінети і години на тиждень</label>
        <div id="subjectRows"></div>
        <button type="button" class="btn btn-ghost" id="addSubjectRowBtn" style="margin-top:8px;">+ Додати ще предмет</button>
      </div>
      <p class="empty-hint" style="margin:8px 0 0;">Кількість годин — це стандарт по предмету на тиждень (наприклад, «Інформатика — 2 год»); ця сама кількість застосується до кожного обраного класу. У кожного класу — свій окремий кабінет (наприклад, 10-А в каб.24, а 10-Б в каб.25). Якщо предмет читається в кількох класах — тисніть «+ Додати ще клас до цього предмета», не вводячи назву предмета повторно.</p>
      <div class="row" style="margin-top:14px;">
        <div class="field" style="min-width:160px;">
          <label for="newTeacherPeriods">Уроків на день (макс.)</label>
          <select id="newTeacherPeriods">
            ${[5,6,7,8].map(n=>`<option value="${n}" ${n===7?'selected':''}>${n}</option>`).join('')}
          </select>
        </div>
        <button class="btn btn-gold" id="addTeacherBtn" style="align-self:flex-end;">+ Додати вчителя та скласти розклад</button>
      </div>
    </div>
    <div id="teachersList"></div>
  `;
  document.getElementById('modeListBtn').onclick = ()=>{ staffViewMode='list'; renderStaffTab(); };
  document.getElementById('modeOverallBtn').onclick = ()=>{ staffViewMode='overall'; renderStaffTab(); };
  renderSubjectRows();
  document.getElementById('addSubjectRowBtn').onclick = ()=>{
    newTeacherRows.push({ name:'', hours:'', groups:[{ gradeNum:'', letters:[], room:'' }] });
    renderSubjectRows();
  };
  document.getElementById('addTeacherBtn').onclick = ()=>{
    const name = document.getElementById('newTeacherName').value.trim();
    if(!name){ showToast('Введіть прізвище та ім\'я вчителя'); return; }
    syncSubjectRowsFromInputs();
    const entries = newTeacherRows.flatMap(expandRowToEntries);
    const periods = parseInt(document.getElementById('newTeacherPeriods').value) || 7;
    const schedule = emptySchedule(periods);
    const teacherId = uid();
    let leftover = [];
    if(entries.length){
      leftover = autoDistributeHours(
        teacherId,
        schedule,
        entries,
        buildStaggerOptions(state.teachers.length, periods)
      );
    }
    const subjectSummary = Array.from(new Set(newTeacherRows.filter(r=>r.name.trim()).map(r=>r.name.trim()))).join(', ');
    state.teachers.push({ id: teacherId, name, subject: subjectSummary, schedule });
    saveState();
    renderStaffTab();
    const conflicted = leftover.filter(l=>l.conflict);
    if(leftover.length){
      const msg = leftover.map(l=>`${l.name} (ще ${l.remaining} год.${l.conflict?', частина через зайнятий кабінет/клас':''})`).join(', ');
      showToast(`Вчителя додано. Не вистачило місць для: ${msg} — донесіть вручну.`);
    } else {
      showToast('Вчителя додано, розклад складено автоматично');
    }
  };
  renderTeachersList();
}

function renderTeachersList(){
  const list = document.getElementById('teachersList');
  if(!state.teachers.length){
    list.innerHTML = `<div class="card"><p class="empty-hint">Ще немає жодного вчителя. Додайте першого вище.</p></div>`;
    return;
  }
  list.innerHTML = state.teachers.map(t=>{
    const isOpen = openTeacherIds.has(t.id);
    const periodCount = t.schedule['Пн'].length;
    let rows = '';
    for(let p=0;p<periodCount;p++){
      rows += `<tr><td class="per-num">${p+1}</td>`;
      WEEKDAY_KEYS.forEach(day=>{
        rows += `<td><input type="text" data-teacher="${t.id}" data-day="${day}" data-period="${p}" value="${escapeHtml(t.schedule[day][p]||'')}" placeholder="—" aria-label="${day}, урок ${p+1}"></td>`;
      });
      rows += `</tr>`;
    }
    const filled = WEEKDAY_KEYS.reduce((s,d)=> s + t.schedule[d].filter(x=>x.trim()).length, 0);
    return `
    <div class="card teacher-card">
      <div class="teacher-head" data-teacher-toggle="${t.id}">
        <div class="teacher-head-left">
          <span class="teacher-name">${escapeHtml(t.name)}</span>
          <span class="teacher-subject">${escapeHtml(t.subject||'предмет не вказано')} · ${filled} уроків у розкладі</span>
        </div>
        <div class="row" style="gap:8px;">
          <button type="button" class="btn btn-danger btn-icon delete-teacher-btn" data-teacher="${t.id}" aria-label="Видалити вчителя" title="Видалити вчителя">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>
          <svg class="chevron ${isOpen?'rot':''}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="teacher-body ${isOpen?'open':''}" id="teacherBody-${t.id}">
        <div style="overflow-x:auto;">
          <table class="sched">
            <thead><tr><th></th>${WEEKDAY_KEYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="row" style="margin-top:12px;">
          <button class="btn btn-ghost add-period-btn" data-teacher="${t.id}">+ Додати урок</button>
          <button class="btn btn-ghost remove-period-btn" data-teacher="${t.id}" ${periodCount<=1?'disabled':''}>− Прибрати останній</button>
        </div>
        <div class="row" style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--paper-line); gap:8px;">
          <div class="input-with-mic" style="flex:2; min-width:140px;">
            <input type="text" class="auto-subj-name" data-teacher="${t.id}" placeholder="Предмет" value="${escapeHtml((lastAutoSubjInput[t.id]||{}).name||'')}">
            <button type="button" class="mic-btn" aria-label="Голосове введення" title="Голосове введення"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg></button>
          </div>
          <input type="text" inputmode="numeric" class="auto-subj-hours" data-teacher="${t.id}" placeholder="Годин/тиждень (по предмету)" value="${escapeHtml((lastAutoSubjInput[t.id]||{}).hours||'')}" style="flex:1; min-width:170px;">
        </div>
        <div class="row" style="margin-top:8px; gap:8px; align-items:center;">
          <select class="auto-subj-grade" data-teacher="${t.id}" style="min-width:110px;">
            <option value="">Клас — не вказано</option>
            ${Array.from({length:12},(_,n)=>n+1).map(n=>`<option value="${n}">${n} клас</option>`).join('')}
          </select>
          <div class="input-with-mic" style="min-width:110px; max-width:160px;">
            <input type="text" class="auto-subj-room" data-teacher="${t.id}" placeholder="Кабінет" value="${escapeHtml((lastAutoSubjInput[t.id]||{}).room||'')}">
            <button type="button" class="mic-btn" aria-label="Голосове введення" title="Голосове введення"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg></button>
          </div>
        </div>
        <div class="row" style="margin-top:8px; gap:6px; align-items:center;">
          <span class="empty-hint" style="padding:0; margin-right:2px;">Літери:</span>
          ${CLASS_LETTERS.map(l=>`<button type="button" class="day-pill auto-subj-letter-pill" data-teacher="${t.id}" data-letter="${l}">${l}</button>`).join('')}
          <button type="button" class="btn btn-ghost auto-subj-select-all" data-teacher="${t.id}" style="padding:6px 12px; min-height:38px; font-size:12.5px;">Усі (А–Д)</button>
          <button type="button" class="btn btn-ghost auto-distribute-btn" data-teacher="${t.id}" style="margin-left:auto;">Автоматично додати в розклад</button>
        </div>
        <p class="empty-hint" style="margin:6px 0 0;">Предмет, години й кабінет запам'ятовуються після додавання — щоб дописати ще один клас того самого предмета, просто оберіть новий клас/літери й натисніть кнопку ще раз.</p>
      </div>
    </div>`;
  }).join('');

  const autoSubjLetters = {}; // teacherId -> обрані літери для форми автододавання
  list.querySelectorAll('.auto-subj-letter-pill').forEach(pill=>{
    const tId = pill.dataset.teacher;
    if(!autoSubjLetters[tId]) autoSubjLetters[tId] = [];
    pill.onclick = (e)=>{
      e.stopPropagation();
      const l = pill.dataset.letter;
      const arr = autoSubjLetters[tId];
      const idx = arr.indexOf(l);
      if(idx===-1) arr.push(l); else arr.splice(idx,1);
      pill.classList.toggle('active');
    };
  });
  list.querySelectorAll('.auto-subj-select-all').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const tId = btn.dataset.teacher;
      const pills = list.querySelectorAll(`.auto-subj-letter-pill[data-teacher="${cssEscape(tId)}"]`);
      const allSelected = (autoSubjLetters[tId]||[]).length === CLASS_LETTERS.length;
      autoSubjLetters[tId] = allSelected ? [] : [...CLASS_LETTERS];
      pills.forEach(p=> p.classList.toggle('active', !allSelected));
    };
  });

  list.querySelectorAll('.auto-distribute-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const teacher = state.teachers.find(t=>t.id===btn.dataset.teacher);
      const nameInp = list.querySelector(`.auto-subj-name[data-teacher="${cssEscape(btn.dataset.teacher)}"]`);
      const hoursInp = list.querySelector(`.auto-subj-hours[data-teacher="${cssEscape(btn.dataset.teacher)}"]`);
      const gradeSel = list.querySelector(`.auto-subj-grade[data-teacher="${cssEscape(btn.dataset.teacher)}"]`);
      const roomInp = list.querySelector(`.auto-subj-room[data-teacher="${cssEscape(btn.dataset.teacher)}"]`);
      const subj = nameInp.value.trim();
      const hours = parseInt(hoursInp.value);
      if(!subj || !hours){ showToast('Вкажіть предмет і кількість годин'); return; }
      const gradeNum = gradeSel.value;
      const room = roomInp.value.trim();
      const letters = autoSubjLetters[btn.dataset.teacher] || [];
      const entries = letters.length
        ? letters.map(l=>({ name: subj, hours, room, classLabel: gradeNum ? `${gradeNum}-${l}` : l }))
        : [{ name: subj, hours, room, classLabel: gradeNum ? `${gradeNum} клас` : '' }];
      const teacherIdx = state.teachers.findIndex(t=>t.id===btn.dataset.teacher);
      const periodsPerDay = teacher.schedule['Пн'].length;
      const leftover = autoDistributeHours(teacher.id, teacher.schedule, entries, buildStaggerOptions(teacherIdx, periodsPerDay));
      lastAutoSubjInput[teacher.id] = { name: subj, hours: String(hours), room };
      saveState();
      openTeacherIds.add(teacher.id);
      renderTeachersList();
      if(leftover.length){
        const conflictNote = leftover.some(l=>l.conflict) ? ' (частина місць зайнята цим кабінетом/класом в іншого вчителя)' : '';
        const totalMissing = leftover.reduce((s,l)=>s+l.remaining,0);
        showToast(`Додано частково — не вистачило ${totalMissing} год. вільних клітинок${conflictNote}. Розширте розклад кнопкою «+ Додати урок».`);
      } else {
        showToast(`«${subj}» розподілено по розкладу (${entries.length>1? entries.length+' класів × ':''}${hours} год.)`);
      }
    };
  });
  list.querySelectorAll('[data-teacher-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.teacherToggle;
      if(openTeacherIds.has(id)) openTeacherIds.delete(id); else openTeacherIds.add(id);
      renderTeachersList();
    });
  });
  list.querySelectorAll('table.sched input[data-teacher]').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', ()=>{
      const teacher = state.teachers.find(t=>t.id===inp.dataset.teacher);
      if(teacher){
        teacher.schedule[inp.dataset.day][parseInt(inp.dataset.period)] = inp.value;
        delete state.cellMeta[cellMetaKey(inp.dataset.teacher, inp.dataset.day, parseInt(inp.dataset.period))];
      }
      saveState();
    });
  });
  list.querySelectorAll('.auto-subj-name, .auto-subj-hours, .auto-subj-grade, .auto-subj-letter, .auto-subj-room').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
  });
  list.querySelectorAll('.add-period-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const teacher = state.teachers.find(t=>t.id===btn.dataset.teacher);
      WEEKDAY_KEYS.forEach(d=>teacher.schedule[d].push(''));
      saveState(); renderTeachersList();
    };
  });
  list.querySelectorAll('.remove-period-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const teacher = state.teachers.find(t=>t.id===btn.dataset.teacher);
      const lastPeriod = teacher.schedule['Пн'].length - 1;
      WEEKDAY_KEYS.forEach(d=>{
        teacher.schedule[d].pop();
        delete state.cellMeta[cellMetaKey(teacher.id, d, lastPeriod)];
      });
      saveState(); renderTeachersList();
    };
  });
  list.querySelectorAll('.delete-teacher-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      if(btn.dataset.confirming !== 'true'){
        btn.dataset.confirming = 'true';
        btn.dataset.originalHtml = btn.innerHTML;
        btn.innerHTML = 'Підтвердити видалення';
        btn.style.width = 'auto';
        btn.style.padding = '9px 14px';
        btn.classList.add('confirming');
        showToast('Натисніть кнопку ще раз, щоб остаточно видалити вчителя');
        btn._revertTimer = setTimeout(()=>{
          btn.dataset.confirming = 'false';
          btn.innerHTML = btn.dataset.originalHtml;
          btn.style.width = '';
          btn.style.padding = '';
          btn.classList.remove('confirming');
        }, 5000);
        return;
      }
      clearTimeout(btn._revertTimer);
      const teacherObj = state.teachers.find(t=>t.id===btn.dataset.teacher);
      state.teachers = state.teachers.filter(t=>t.id!==btn.dataset.teacher);
      openTeacherIds.delete(btn.dataset.teacher);
      Object.keys(state.cellMeta).forEach(key=>{
        if(key.startsWith(`${btn.dataset.teacher}__`)) delete state.cellMeta[key];
      });
      saveState();
      renderTeachersList();
      showToast(`Вчителя ${teacherObj ? teacherObj.name : ''} видалено`);
    };
  });
}

/* ====================== МІЙ РОЗКЛАД ====================== */
function renderMyScheduleTab(){
  const c = document.getElementById('content');
  const periodCount = state.mySchedule['Пн'].length;
  let rows = '';
  for(let p=0;p<periodCount;p++){
    rows += `<tr><td class="per-num">${p+1}</td>`;
    WEEKDAY_KEYS.forEach(day=>{
      rows += `<td><input type="text" data-day="${day}" data-period="${p}" value="${escapeHtml(state.mySchedule[day][p]||'')}" placeholder="—" aria-label="${day}, урок ${p+1}"></td>`;
    });
    rows += `</tr>`;
  }
  c.innerHTML = `
    <div class="card">
      <h2>Мій тижневий розклад</h2>
      <div style="overflow-x:auto;">
        <table class="sched">
          <thead><tr><th></th>${WEEKDAY_KEYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
          <tbody id="myschedBody">${rows}</tbody>
        </table>
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="btn btn-ghost" id="addMyPeriod">+ Додати рядок</button>
        <button class="btn btn-ghost" id="removeMyPeriod" ${periodCount<=1?'disabled':''}>− Прибрати останній</button>
      </div>
    </div>
  `;
  document.querySelectorAll('#myschedBody input').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      state.mySchedule[inp.dataset.day][parseInt(inp.dataset.period)] = inp.value;
      saveState();
    });
  });
  document.getElementById('addMyPeriod').onclick = ()=>{
    WEEKDAY_KEYS.forEach(d=>state.mySchedule[d].push(''));
    saveState(); renderMyScheduleTab();
  };
  document.getElementById('removeMyPeriod').onclick = ()=>{
    WEEKDAY_KEYS.forEach(d=>state.mySchedule[d].pop());
    saveState(); renderMyScheduleTab();
  };
}

  return `Ти — досвідчений консультант з управління освітнім процесом у школі. Заступниця директора з навчально-виховної роботи Гайдай Галина Володимирівна потребує допомоги з таким завданням:

Назва: "${title}"
Опис/контекст: "${description || 'додаткового контексту не надано'}"

Склади детальний, практичний план виконання цього завдання: конкретні кроки у логічній послідовності, орієнтовні терміни для кожного кроку, необхідні ресурси чи документи, можливі складнощі й як їх уникнути. Пиши українською мовою, структуруй відповідь заголовками Markdown (##). Не додавай зайвих вступних фраз.`;
}

function renderPlanningTab(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="card">
      <h2>Новий запис планування</h2>
      <div class="field">
        <label for="planTitle">Назва завдання / плану</label>
        <div class="input-with-mic">
          <input type="text" id="planTitle" placeholder="Наприклад: Підготовка до атестації вчителів">
          <button type="button" class="mic-btn" aria-label="Голосове введення" title="Голосове введення"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg></button>
        </div>
      </div>
      <div class="field" style="margin-top:10px;">
        <label for="planDesc">Деталі, контекст, побажання</label>
        <div class="input-with-mic">
          <textarea id="planDesc" placeholder="Наприклад: атестація у березні, 6 вчителів, потрібен графік і перелік документів"></textarea>
          <button type="button" class="mic-btn" aria-label="Голосове введення" title="Голосове введення"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg></button>
        </div>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="btn btn-gold" id="addPlanBtn">+ Додати запис</button>
      </div>
    </div>
    <div id="plansList"></div>
  `;
  document.getElementById('addPlanBtn').onclick = ()=>{
    const title = document.getElementById('planTitle').value.trim();
    const description = document.getElementById('planDesc').value.trim();
    if(!title){ showToast('Введіть назву завдання'); return; }
    state.plans.unshift({ id: uid(), title, description, createdAt: new Date().toISOString() });
    saveState();
    renderPlanningTab();
    showToast('Запис додано');
  };
  renderPlansList();
}

function renderPlansList(){
  const list = document.getElementById('plansList');
  if(!state.plans.length){
    list.innerHTML = `<div class="card"><p class="empty-hint">Ще немає жодного запису. Додайте перший вище.</p></div>`;
    return;
  }
  list.innerHTML = state.plans.map(p=>{
    const d = new Date(p.createdAt);
    const dateLabel = `${d.getDate()} ${MONTH_NAMES[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
    return `
    <div class="card plan-card">
      <div class="plan-title">${escapeHtml(p.title)}</div>
      <div class="plan-meta">Додано ${dateLabel}</div>
      ${p.description ? `<div class="plan-desc">${escapeHtml(p.description)}</div>` : ''}
      <div class="row">
        <button class="btn btn-primary gen-prompt-btn" data-plan="${p.id}">Згенерувати промпт</button>
        <button class="btn btn-danger delete-plan-item-btn" data-plan="${p.id}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          Видалити
        </button>
      </div>
      <div id="promptWrap-${p.id}"></div>
    </div>`;
  }).join('');

  list.querySelectorAll('.gen-prompt-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const plan = state.plans.find(x=>x.id===btn.dataset.plan);
      const prompt = buildPlanPrompt(plan.title, plan.description);
      const wrap = document.getElementById(`promptWrap-${plan.id}`);
      wrap.innerHTML = `
        <div class="prompt-output">${escapeHtml(prompt)}</div>
        <div class="row" style="margin-top:10px;">
          <button class="btn btn-ghost copy-prompt-btn" data-prompt-id="${plan.id}">Копіювати промпт</button>
        </div>
      `;
      wrap.dataset.promptText = prompt;
      wrap.querySelector('.copy-prompt-btn').onclick = ()=>copyTextToClipboard(prompt);
    };
  });
  list.querySelectorAll('.delete-plan-item-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.confirming !== 'true'){
        btn.dataset.confirming = 'true';
        btn.dataset.originalHtml = btn.innerHTML;
        btn.innerHTML = 'Підтвердити видалення';
        btn.classList.add('confirming');
        btn._revertTimer = setTimeout(()=>{
          btn.dataset.confirming = 'false';
          btn.innerHTML = btn.dataset.originalHtml;
          btn.classList.remove('confirming');
        }, 4000);
        return;
      }
      clearTimeout(btn._revertTimer);
      state.plans = state.plans.filter(x=>x.id!==btn.dataset.plan);
      saveState();
      renderPlansList();
      showToast('Запис видалено');
    };
  });
}

/* ====================== ГОЛОСОВЕ ВВЕДЕННЯ ====================== */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRecognition = null;

function showErrorModal(title, message){
  const overlay = document.getElementById('dayOverlay');
  const modal = document.getElementById('dayModal');
  modal.innerHTML = `
    <div class="modal-head">
      <div><h2 class="serif" style="margin:0; color:var(--danger);">${escapeHtml(title)}</h2></div>
      <button class="close-x" id="closeErrModal" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <p style="white-space:pre-wrap; line-height:1.6; font-size:13.5px;">${escapeHtml(message)}</p>
    <div class="row" style="margin-top:14px; justify-content:flex-end;">
      <button class="btn btn-primary" id="closeErrModalBtn">Зрозуміло</button>
    </div>
  `;
  overlay.classList.remove('hidden');
  const close = ()=>overlay.classList.add('hidden');
  document.getElementById('closeErrModal').onclick = close;
  document.getElementById('closeErrModalBtn').onclick = close;
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
}

const VOICE_ERROR_MESSAGES = {
  'not-allowed': 'Браузер заблокував доступ до мікрофона. Натисніть на значок замка/мікрофона в адресному рядку і дозвольте доступ до мікрофона для цього сайту, потім спробуйте ще раз.',
  'permission-denied': 'Доступ до мікрофона не надано. Дозвольте доступ до мікрофона в налаштуваннях браузера для цього сайту.',
  'service-not-allowed': 'Браузер не дозволяє розпізнавання мовлення на цій сторінці. Переконайтеся, що сайт відкритий через https:// (не просто відкритий як файл), і що мікрофон дозволено.',
  'audio-capture': 'Мікрофон не знайдено. Перевірте, чи підключений мікрофон і чи дозволений він у налаштуваннях системи.',
  'network': 'Немає з\'єднання з сервісом розпізнавання мовлення (Chrome для цього потребує інтернет). Перевірте інтернет-з\'єднання і спробуйте ще раз.',
  'language-not-supported': 'Українська мова розпізнавання недоступна в цьому браузері.',
  'no-speech': 'Не почула жодного звуку — спробуйте ще раз і говоріть одразу після натискання.',
  'aborted': null // тихо ігноруємо (користувач сам зупинив)
};

function toggleVoiceInput(btn){
  const field = btn.previousElementSibling;
  if(!field || !('value' in field)) return;

  if(activeRecognition){
    activeRecognition.stop();
    return;
  }
  if(!window.isSecureContext){
    showErrorModal('Голосове введення недоступне', 'Ця сторінка відкрита не через https:// (наприклад, як локальний файл), тому браузер блокує доступ до мікрофона. Відкрийте сайт за посиланням https://... і спробуйте ще раз.');
    return;
  }
  if(!SpeechRecognitionCtor){
    showErrorModal('Голосове введення не підтримується', 'Цей браузер не підтримує голосове введення. Спробуйте відкрити сайт у Google Chrome на комп\'ютері або в Chrome на Android.');
    return;
  }
  const rec = new SpeechRecognitionCtor();
  rec.lang = 'uk-UA';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  activeRecognition = rec;
  btn.classList.add('recording');
  showToast('Говоріть — я слухаю...');

  rec.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    const needsSpace = field.value && !/\s$/.test(field.value);
    field.value = field.value + (needsSpace ? ' ' : '') + text;
    field.dispatchEvent(new Event('input', { bubbles:true }));
    field.dispatchEvent(new Event('change', { bubbles:true }));
  };
  rec.onerror = (e)=>{
    console.error('Помилка розпізнавання мовлення', e.error, e);
    btn.classList.remove('recording');
    if(VOICE_ERROR_MESSAGES.hasOwnProperty(e.error)){
      const msg = VOICE_ERROR_MESSAGES[e.error];
      if(msg) showErrorModal('Помилка голосового введення', msg);
    } else {
      showErrorModal('Помилка голосового введення', `Технічна причина: ${e.error || 'невідома помилка'}.\n\nСпробуйте ще раз, перевірте дозвіл на мікрофон і з'єднання з інтернетом.`);
    }
  };
  rec.onend = ()=>{
    btn.classList.remove('recording');
    activeRecognition = null;
  };
  try{ rec.start(); }catch(err){
    console.error(err);
    btn.classList.remove('recording');
    activeRecognition = null;
    showErrorModal('Помилка голосового введення', `Не вдалося запустити розпізнавання: ${err && err.message ? err.message : err}`);
  }
}

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.mic-btn');
  if(btn){
    e.preventDefault();
    e.stopPropagation();
    toggleVoiceInput(btn);
  }
});

async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      showToast('Скопійовано');
      return;
    }
    throw new Error('clipboard API недоступний');
  }catch(err){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.top='-1000px'; ta.style.left='-1000px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok){ showToast('Скопійовано'); return; }
      throw new Error('execCommand не спрацював');
    }catch(err2){
      showToast('Не вдалося скопіювати автоматично — виділіть текст вручну');
    }
  }
}
